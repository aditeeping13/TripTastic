spring.application.name=tours-and-travels-system

# ============================================
# MongoDB Configuration
# ============================================
# Using MongoDB Atlas cloud database
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb+srv://123cs0204:03082004ts@cluster0.eore8d9.mongodb.net/tours_travel_system}}
spring.data.mongodb.database=${MONGODB_DATABASE:tours_travel_system}

# ============================================
# CORS Configuration
# ============================================
# Frontend URL for CORS (Cross-Origin Resource Sharing)
frontend.url=${FRONTEND_URL:http://localhost:3000}

# ============================================
# API Documentation (Swagger/OpenAPI)
# ============================================
springdoc.packagesToScan=com.toursandtravel.controller
springdoc.pathsToMatch=/api/**

# ============================================
# File Upload Configuration
# ============================================
# Path where uploaded images will be stored
# Using relative path in project directory
com.toursandtravel.image.folder.path=uploads

# Maximum file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8080}

# ============================================
# Logging Configuration
# ============================================
logging.level.com.toursandtravel=INFO
logging.level.org.springframework.web=INFO

